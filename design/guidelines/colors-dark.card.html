<!-- @dsCard group="Colors" viewport="700x200" name="Dark surface" subtitle="data-theme=&quot;dark&quot; remaps the same semantic tokens — no dark branches in components" -->
<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;font-family:var(--font-ui);display:flex;gap:14px}.pane{flex:1;background:var(--surface-page);border-radius:var(--radius-card);padding:14px;display:grid;gap:10px}.bar{background:var(--surface-card);border:1px solid var(--line-soft);border-radius:var(--radius-md);padding:8px 10px;font-family:var(--font-display);font-weight:800;color:var(--text-body);font-size:var(--text-md)}.tiles{display:flex;gap:6px}.t{width:34px;height:34px;border:2px solid var(--tile-filled-border);border-radius:var(--radius-tile);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;color:var(--text-body);font-size:var(--text-sm)}.t.c{background:var(--tile-correct-bg);border-color:var(--tile-correct-border);color:var(--tile-text-correct)}.t.p{background:var(--tile-present-bg);border-color:var(--tile-present-border);color:var(--tile-text-present)}.t.a{background:var(--tile-absent-bg);border-color:var(--tile-absent-border);color:var(--tile-text-absent)}.keys{display:flex;gap:5px}.k{flex:1;height:30px;background:var(--key-bg);border-radius:var(--radius-key);box-shadow:var(--shadow-inset)}.n{font-size:10px;font-family:var(--font-mono);color:var(--text-subtle)}</style>
</head><body>
<div class="pane"><div class="bar">كلمات</div><div class="tiles"><div class="t c">م</div><div class="t p">د</div><div class="t a">ر</div><div class="t">س</div></div><div class="keys"><div class="k"></div><div class="k"></div><div class="k"></div><div class="k"></div><div class="k"></div></div><div class="n">:root — light</div></div>
<div class="pane" data-theme="dark"><div class="bar">كلمات</div><div class="tiles"><div class="t c">م</div><div class="t p">د</div><div class="t a">ر</div><div class="t">س</div></div><div class="keys"><div class="k"></div><div class="k"></div><div class="k"></div><div class="k"></div><div class="k"></div></div><div class="n">[data-theme="dark"]</div></div>
</body></html>
