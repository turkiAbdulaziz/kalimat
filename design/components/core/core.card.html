</head><body><div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Badge, Toast, Switch } = window.KalimatDesignSystem_9392cf;
function Demo(){

}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
