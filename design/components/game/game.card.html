<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-ui);color:var(--text-body)}.lbl{font-size:var(--text-2xs);color:var(--text-subtle);margin:0 0 6px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Tile, GuessGrid, Keyboard } = window.KalimatDesignSystem_9392cf;
const rows=[[{letter:"ك",state:"correct"},{letter:"ت",state:"absent"},{letter:"ا",state:"present"},{letter:"ب",state:"absent"}],[{letter:"ك",state:"correct"},{letter:"ل",state:"correct"},{letter:"م",state:"correct"},{letter:"ة",state:"correct"}]];

  <div style={{display:"flex",gap:28,alignItems:"flex-start"}}>
    <div>
      <p className="lbl">الحالات</p>
      <div style={{display:"flex",gap:6}}>

      </div>
      <p className="lbl" style={{marginTop:18}}>اللوحة</p>
      <GuessGrid rows={rows} wordLength={4} maxGuesses={3} tileSize={44}/>
    </div>
    <div style={{flex:1,minWidth:300}}>
      <p className="lbl">لوحة المفاتيح</p>
      <Keyboard letterStates={{"ك":"correct","ل":"correct","م":"correct","ة":"correct","ت":"absent","ب":"absent","ا":"present"}}/>
    </div>
  </div>
);
</script></body></html>
